server:
  port: 8088  #端口
  tomcat:
    uri-encoding: UTF-8   #服务编码
spring:
  profiles:
    active: dev
  application:
    name: lt-trade
  cloud:
    nacos:
      config:
        file-extension: yaml
        shared-configs: # 共享配置
          - dataId: shared-spring.yaml # 共享spring配置
          - dataId: shared-redis.yaml # 共享redis配置
          - dataId: shared-mybatis.yaml # 共享mybatis配置
          - dataId: shared-logs.yaml # 共享日志配置
          - dataId: shared-feign.yaml # 共享feign配置
          - dataId: shared-mq.yaml # 共享mq配置
          - dataId: shared-xxljob.yaml # 共享mq配置
tj:
  mq:
    error-service-name: trade-service
  swagger:
    enable: true
    enableResponseWrap: true
    package-path: com.learntrail.trade.controller
    title: 学途 LearnTrail · 订单与售后 API
    description: 购物车、课程订单、支付申请与退款审核
    contact-name: LearnTrail Maintainers
    contact-url: ""
    contact-email: ""
    version: v1.0
  jdbc:
    database: tj_trade
  auth:
    resource:
      enable: true
      excludeLoginPaths:
        - "/order-details/enrollNum"
