server:
  port: 8081  #端口
  tomcat:
    uri-encoding: UTF-8   #服务编码
spring:
  profiles:
    active: dev
  application:
    name: lt-auth
  cloud:
    nacos:
      config:
        file-extension: yaml
        shared-configs: # 共享配置
          - data-id: shared-spring.yaml # 共享spring配置
            refresh: false
          - data-id: shared-redis.yaml # 共享redis配置
            refresh: false
          - data-id: shared-mybatis.yaml # 共享mybatis配置
            refresh: false
          - data-id: shared-logs.yaml # 共享日志配置
            refresh: false
encrypt:
  key-store:
    alias: "${LEARNTRAIL_JWT_KEY_ALIAS}"
    location: "${LEARNTRAIL_JWT_KEYSTORE_LOCATION}"
    password: "${LEARNTRAIL_JWT_STORE_PASSWORD}"
    secret: "${LEARNTRAIL_JWT_KEY_PASSWORD}"
tj:
  mq:
    error-service-name: auth-service
  swagger:
    enable: true
    enableResponseWrap: true
    package-path: com.learntrail.auth.controller
    title: 学途 LearnTrail · 身份与权限 API
    description: 账号登录、角色授权与资源访问控制
    contact-name: LearnTrail Maintainers
    contact-url: ""
    contact-email: ""
    version: v1.0
  auth:
    resource:
      enable: true
      includeLoginPaths:
        - /menus/me
        - /accounts/logout
  jdbc:
    database: tj_auth
