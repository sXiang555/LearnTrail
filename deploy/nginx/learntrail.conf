# Include inside nginx's http {} block.
# Replace the static root and upstream addresses for split-host deployments.
server {
    listen 80;
    server_name www.learntrail.com;
    root /etc/nginx/html/learntrail-web;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_set_header Host api.learntrail.com;
        proxy_set_header Origin http://www.learntrail.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://127.0.0.1:10010/;
    }

    location ~ ^/ai/v1/(sessions|skills|memories)(/|$) {
        rewrite ^/ai/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location /ai/ { return 404; }
}

server {
    listen 80;
    server_name api.learntrail.com;
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://127.0.0.1:10010;
    }
}

server {
    listen 80;
    server_name manage.learntrail.com;
    return 302 http://www.learntrail.com/#/studio;
}
