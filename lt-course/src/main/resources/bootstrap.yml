server:
  port: 8086  #端口
  tomcat:
    uri-encoding: UTF-8   #服务编码
spring:
  profiles:
    active: dev
  application:
    name: lt-course
  main:
    allow-circular-references: true
  cloud:
    nacos:
      config:
        file-extension: yaml
        shared-configs: # 共享配置
          - data-id: shared-spring.yaml # 共享spring配置
          - data-id: shared-redis.yaml # 共享redis配置
          - data-id: shared-mybatis.yaml # 共享mybatis配置
          - data-id: shared-logs.yaml # 共享日志配置
          - data-id: shared-feign.yaml # 共享feign配置
          - data-id: shared-mq.yaml # 共享MQ配置
          - data-id: shared-seata.yaml # 共享seata配置
          - data-id: shared-xxljob.yaml # 共享seata配置
tj:
  mq:
    error-service-name: course-service
  swagger:
    enable: true
    package-path: com.learntrail.course.controller
    title: 学途 LearnTrail · 课程内容 API
    description: 课程草稿、发布、分类与目录管理
    contact-name: LearnTrail Maintainers
    contact-url: ""
    contact-email: ""
    version: v1.0
    enableResponseWrap: true
  auth:
    resource:
      enable: false
  jdbc:
    database: tj_course
